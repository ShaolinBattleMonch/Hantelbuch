<!--
  BUILT · E-Mail-Vorlagen für Supabase (Authentication → Emails → Templates)

  Dieselbe Vorlage kommt in ZWEI Felder, damit neue und bestehende Nutzer
  immer einen Code bekommen und nie einen Link:
    1. „Confirm sign up“   – Betreff: Dein BUILT-Code: {{ .Token }}
    2. „Magic link or OTP“ – Betreff: Dein BUILT-Code: {{ .Token }}

  Alles ab <!doctype html> bis zum Ende in das Feld „Message body“ kopieren.
-->
<!doctype html>
<html lang="de">
<head><meta name="color-scheme" content="dark"><meta name="supported-color-schemes" content="dark"></head>
<body style="margin:0;padding:0;background:#000000;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" bgcolor="#000000" style="background:#000000;padding:32px 12px;">
    <tr><td align="center">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" bgcolor="#000000" style="max-width:440px;background:#000000;border:1px solid #333333;border-radius:24px;">
        <tr><td style="padding:36px 32px 8px;font-family:Arial,Helvetica,sans-serif;color:#ffffff;font-size:28px;font-weight:900;letter-spacing:-0.5px;">BUILT</td></tr>
        <tr><td style="padding:8px 32px 0;font-family:Arial,Helvetica,sans-serif;color:#ffffff;font-size:16px;line-height:1.5;">Dein Anmelde-Code:</td></tr>
        <tr><td style="padding:16px 32px 8px;">
          <div style="font-family:'Courier New',Courier,monospace;font-size:40px;font-weight:700;letter-spacing:10px;color:#000000;background:#ffffff;border-radius:16px;padding:18px 0;text-align:center;">{{ .Token }}</div>
        </td></tr>
        <tr><td style="padding:8px 32px 0;font-family:Arial,Helvetica,sans-serif;color:#bdbdbd;font-size:14px;line-height:1.5;">Tippe den Code in der App ein. Er gilt 10 Minuten und nur einmal.</td></tr>
        <tr><td style="padding:16px 32px 32px;font-family:Arial,Helvetica,sans-serif;color:#8a8a8a;font-size:12px;line-height:1.5;">Du hast keinen Code angefordert? Dann kannst du diese Mail einfach ignorieren. Niemand kommt ohne diesen Code in dein Konto.</td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
